// ─── PIECE LIST ───────────────────────────────────────────────────────────────
function buildPieceList() {
  const list = document.getElementById('piecesList');
  list.innerHTML = '';
  const filtered = colorFilter==='all' ? PIECES : PIECES.filter(p => p.color===colorFilter);

  // Scale so the largest piece (3×3) fills the canvas, smaller pieces scale proportionally.
  // This keeps size differences visually clear while keeping 1×1 pieces legible.
  const CANVAS_SIZE = 48;
  const sizeMap = { 1: 24, 2: 32, 3: 48 };

  filtered.forEach(p => {
    const item = document.createElement('div');
    item.className = 'piece-item' + (selectedPiece?.id===p.id ? ' selected' : '');
    item.dataset.id = p.id;

    const cvs = document.createElement('canvas');
    cvs.width = CANVAS_SIZE; cvs.height = CANVAS_SIZE;
    const ctx = cvs.getContext('2d');
    const maxDim = Math.max(p.w, p.h);
    const pxSize = sizeMap[maxDim] || 48;
    const pw = p.w * (pxSize / maxDim);
    const ph = p.h * (pxSize / maxDim);
    const ox = (CANVAS_SIZE - pw) / 2;
    const oy = (CANVAS_SIZE - ph) / 2;
    drawShape(ctx, p, ox, oy, pw, ph, 0, COLORS[p.color], false, false);
    cvs.className = 'piece-preview';

    const info = document.createElement('div');
    info.className = 'piece-info';
    info.innerHTML = `<div class="piece-id">${p.id}</div><div class="piece-name">${p.w}×${p.h} ${p.name}</div>`;

    item.appendChild(cvs); item.appendChild(info);
    item.addEventListener('click', () => selectPiece(p));
    list.appendChild(item);
  });
}
function selectPiece(p) {
  selectedPiece = p;
  document.querySelectorAll('.piece-item').forEach(el => el.classList.toggle('selected', el.dataset.id===p.id));
  document.getElementById('selectedInfo').textContent = `${p.id} — ${p.name} (${p.w}×${p.h})`;
  if (tool==='erase') setTool('place');
}
document.querySelectorAll('.color-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    colorFilter = dot.dataset.filter;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('active', d===dot));
    buildPieceList();
  });
});

// ─── USAGE PANEL ──────────────────────────────────────────────────────────────
function updateUsage() {
  const counts = {};
  getPlaced().forEach(pp => { counts[pp.piece.id] = (counts[pp.piece.id]||0)+1; });
  const panel = document.getElementById('usagePanel');
  panel.innerHTML = '';
  if (!Object.keys(counts).length) {
    panel.innerHTML = '<div style="padding:12px;font-family:IBM Plex Mono,monospace;font-size:14px;opacity:0.4;text-align:center">Place pieces<br>to track usage</div>';
    return;
  }
  Object.entries(counts).sort().forEach(([id, count]) => {
    const p = PIECES.find(x => x.id===id);
    const row = document.createElement('div');
    row.className = 'palette-row';
    row.innerHTML = `<div class="palette-row-label" style="color:${COLORS[p.color]}">${id.replace('PX-','')}</div><div class="palette-count">×${count}</div>`;
    panel.appendChild(row);
  });
}
function updatePieceCount() {
  const n = getPlaced().length;
  document.getElementById('pieceCount').textContent = `${n} piece${n!==1?'s':''} on ${ap().label}`;
}

// ─── CONTEXT MENU ─────────────────────────────────────────────────────────────
const ctxMenu = document.getElementById('ctxMenu');
let ctxFilter = 'all', ctxTargetCell = null;

function ctxSetFilter(f, btn) {
  ctxFilter = f;
  document.querySelectorAll('.ctx-filter-btn').forEach(b => b.classList.toggle('active', b===btn));
  buildCtxPieces();
}
function buildCtxPieces() {
  const container = document.getElementById('ctxPieces');
  container.innerHTML = '';
  (ctxFilter==='all' ? PIECES : PIECES.filter(p=>p.color===ctxFilter)).forEach(p => {
    const item = document.createElement('div');
    item.className = 'ctx-item' + (selectedPiece?.id===p.id ? ' active-piece' : '');
    const dot = document.createElement('div');
    dot.className = 'ctx-piece-dot'; dot.style.background = COLORS[p.color];
    const lbl = document.createElement('span');
    lbl.textContent = `${p.id} — ${p.name} (${p.w}×${p.h})`;
    item.appendChild(dot); item.appendChild(lbl);
    item.addEventListener('click', () => { selectPiece(p); if (ctxTargetCell) placePiece(ctxTargetCell.col, ctxTargetCell.row); hideCtxMenu(); });
    container.appendChild(item);
  });
}
function showCtxMenu(e, cell) {
  e.preventDefault(); ctxTargetCell = cell;
  document.getElementById('ctxErase').style.display = placedAt(cell.col,cell.row) ? 'flex' : 'none';
  document.getElementById('ctxHeader').textContent = `${ap().label} — col ${cell.col+1}, row ${cell.row+1}`;
  buildCtxPieces();
  let x=e.clientX, y=e.clientY;
  if (x+215>window.innerWidth) x=window.innerWidth-219;
  if (y+330>window.innerHeight) y=window.innerHeight-334;
  ctxMenu.style.left=x+'px'; ctxMenu.style.top=y+'px';
  ctxMenu.classList.add('visible');
}
function hideCtxMenu() { ctxMenu.classList.remove('visible'); ctxTargetCell=null; }
function ctxDoErase() { if (ctxTargetCell) { eraseAt(ctxTargetCell.col,ctxTargetCell.row); redrawActive(); drawHover(); updateUsage(); } hideCtxMenu(); }
document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });

// ─── CLEAR & EXPORT ───────────────────────────────────────────────────────────
function clearActivePlate() {
  if (plates[activePlateIdx].pieces.length === 0) return;
  if (!confirm(`Clear all pieces on ${plates[activePlateIdx].label}?`)) return;
  saveHistory();
  plates[activePlateIdx].pieces = [];
  redrawActive(); drawHover(); updateUsage(); updatePieceCount();
}
document.getElementById('exportBtn').addEventListener('click', () => {
  const ec = document.createElement('canvas');
  ec.width = W+40; ec.height = H+60;
  const et = ec.getContext('2d');
  et.fillStyle='#F5F0E8'; et.fillRect(0,0,ec.width,ec.height);
  et.fillStyle='white'; et.fillRect(20,40,W,H);
  et.drawImage(ap().dom.gridC, 20, 40);
  et.drawImage(ap().dom.piecesC, 20, 40);
  et.strokeStyle='#1A1A1A'; et.lineWidth=2.5; et.strokeRect(20,40,W,H);
  et.fillStyle='#1A1A1A'; et.font='bold 11px monospace';
  et.fillText(`PRIXEL PLANNER — ${ap().label.toUpperCase()} — 16×24`, 20, 28);
  if (mirrorMode) { et.fillStyle='#F5C842'; et.fillText('⇄ MIRROR', W-40, 28); }
  const a = document.createElement('a');
  a.download = `prixel-${ap().label.toLowerCase().replace(/\s+/g,'-')}.png`;
  a.href = ec.toDataURL('image/png'); a.click();
});

// ─── DESIGNS ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'prixel-designs';
let currentDesignId = null; // null = unsaved / new project

function getDesigns() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function putDesigns(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function serializeProject() {
  return {
    plates: plates.map(p => ({
      id: p.id, label: p.label, ink: p.ink,
      pieces: JSON.parse(JSON.stringify(p.pieces))
    })),
    activePlateIdx,
    mirrorMode,
    pieceColorMode,
    customInks: [...inkPalette]
  };
}

function renderDesignThumbnail(data) {
  // Composite all plates onto a single small canvas for the thumbnail
  const THUMB_W = 150, THUMB_H = Math.round(THUMB_W * (H / W));
  const scale = THUMB_W / W;
  const cvs = document.createElement('canvas');
  cvs.width = THUMB_W; cvs.height = THUMB_H;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, THUMB_W, THUMB_H);
  // Draw grid lines
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*CELL*scale,0); ctx.lineTo(c*CELL*scale,THUMB_H); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0,r*CELL*scale); ctx.lineTo(THUMB_W,r*CELL*scale); ctx.stroke(); }
  // Draw pieces from first plate
  const plate = data.plates[0];
  if (plate) {
    plate.pieces.forEach(pp => {
      const piece = PIECES.find(x => x.id === pp.piece.id);
      if (!piece) return;
      const { w, h } = (((pp.rotation%360)+360)%360 === 90 || ((pp.rotation%360)+360)%360 === 270)
        ? {w:piece.h, h:piece.w} : {w:piece.w, h:piece.h};
      const fill = data.pieceColorMode ? COLORS[piece.color] : (plate.ink || '#1A1A1A');
      ctx.save();
      ctx.scale(scale, scale);
      drawShape(ctx, piece, pp.col*CELL+1, pp.row*CELL+1, w*CELL-2, h*CELL-2, pp.rotation, fill, false, false);
      ctx.restore();
    });
  }
  return cvs;
}

function buildDesignsGrid() {
  const body = document.getElementById('dpBody');
  const designs = getDesigns();
  if (designs.length === 0) {
    body.innerHTML = '<div class="dp-empty">No saved designs yet.<br>Hit Save to store your work.</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'dp-grid';
  designs.forEach(d => {
    const card = document.createElement('div');
    card.className = 'dp-card' + (d.id === currentDesignId ? ' active-design' : '');

    // Thumbnail only
    const thumb = renderDesignThumbnail(d.data);
    card.appendChild(thumb);

    // Hover info card slides up from bottom
    const plateCount = d.data.plates.length;
    const hover = document.createElement('div');
    hover.className = 'dp-card-hover';
    hover.innerHTML = `
      <div class="dp-card-hover-name" title="${d.name}">${d.name}</div>
      <div class="dp-card-hover-meta">${plateCount} plate${plateCount!==1?'s':''}</div>
    `;
    const actions = document.createElement('div');
    actions.className = 'dp-card-hover-actions';
    const loadBtn = document.createElement('button');
    loadBtn.className = 'dp-card-btn load';
    loadBtn.textContent = d.id === currentDesignId ? 'Active' : 'Load';
    loadBtn.disabled = d.id === currentDesignId;
    loadBtn.onclick = (e) => { e.stopPropagation(); loadDesign(d.id); };
    const delBtn = document.createElement('button');
    delBtn.className = 'dp-card-btn del';
    delBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:middle"><polyline points="3,5 3,14 13,14 13,5"/><line x1="1" y1="5" x2="15" y2="5"/><line x1="6" y1="5" x2="6" y2="2"/><line x1="10" y1="5" x2="10" y2="2"/><line x1="6" y1="2" x2="10" y2="2"/><line x1="6" y1="8" x2="6" y2="12"/><line x1="10" y1="8" x2="10" y2="12"/></svg>`;
    delBtn.onclick = (e) => { e.stopPropagation(); deleteDesign(d.id); };
    actions.appendChild(loadBtn);
    actions.appendChild(delBtn);
    hover.appendChild(actions);
    card.appendChild(hover);

    grid.appendChild(card);
  });
  body.innerHTML = '';
  body.appendChild(grid);
}

function toggleDesignsPanel() {
  const panel = document.getElementById('designsPanel');
  const isVisible = panel.classList.toggle('visible');
  document.getElementById('designsBtn').classList.toggle('active', isVisible);
  if (isVisible) {
    buildDesignsGrid();
    positionOverlay();
  }
}

function saveDesign() {
  if (currentDesignId) {
    // Overwrite existing
    const designs = getDesigns();
    const idx = designs.findIndex(d => d.id === currentDesignId);
    if (idx !== -1) {
      designs[idx].data = serializeProject();
      designs[idx].savedAt = Date.now();
      putDesigns(designs);
      buildDesignsGrid();
      flashSaveBtn();
      return;
    }
  }
  // First save — show name prompt
  const panel = document.getElementById('designsPanel');
  if (!panel.classList.contains('visible')) panel.classList.add('visible');
  document.getElementById('designsBtn').classList.add('active');
  buildDesignsGrid();
  document.getElementById('dpNamePrompt').classList.add('visible');
  const input = document.getElementById('dpNameInput');
  input.value = '';
  setTimeout(() => input.focus(), 50);
}

function dpConfirmSave() {
  const name = document.getElementById('dpNameInput').value.trim();
  if (!name) { document.getElementById('dpNameInput').focus(); return; }
  const designs = getDesigns();
  const id = 'design-' + Date.now();
  designs.unshift({ id, name, savedAt: Date.now(), data: serializeProject() });
  putDesigns(designs);
  currentDesignId = id;
  document.getElementById('dpNamePrompt').classList.remove('visible');
  buildDesignsGrid();
  flashSaveBtn();
}

function dpCancelSave() {
  document.getElementById('dpNamePrompt').classList.remove('visible');
}

function flashSaveBtn() {
  const btn = document.getElementById('saveBtn');
  btn.classList.add('active');
  setTimeout(() => { btn.classList.remove('active'); }, 1500);
}

function loadDesign(id) {
  const designs = getDesigns();
  const d = designs.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`Load "${d.name}"? Unsaved changes to the current project will be lost.`)) return;
  applyProjectData(d.data);
  currentDesignId = id;
  buildDesignsGrid();
}

function deleteDesign(id) {
  const designs = getDesigns();
  const d = designs.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`Delete "${d.name}"? This cannot be undone.`)) return;
  const filtered = designs.filter(x => x.id !== id);
  putDesigns(filtered);
  if (currentDesignId === id) currentDesignId = null;
  buildDesignsGrid();
}

function applyProjectData(data) {
  // Tear down existing plates
  plates.forEach(p => p.dom.container.remove());
  plates = []; activePlateIdx = 0; plateCounter = 0;
  Object.keys(historyMap).forEach(k => delete historyMap[k]);
  clearSelection();

  // Restore plates
  data.plates.forEach(pd => {
    const p = createPlate(pd.label, pd.ink);
    pd.pieces.forEach(pp => {
      const piece = PIECES.find(x => x.id === pp.piece.id);
      if (piece) p.pieces.push({ piece, col: pp.col, row: pp.row, rotation: pp.rotation });
    });
  });

  activePlateIdx = Math.min(data.activePlateIdx || 0, plates.length - 1);
  setActivePlate(activePlateIdx);

  // Restore modes
  if (data.mirrorMode !== mirrorMode) toggleMirror();
  if (data.pieceColorMode !== pieceColorMode) setColorMode(data.pieceColorMode ? 'native' : 'ink');

  // Restore custom inks (filter out any defaults that may have been serialized in old saves)
  inkPalette = (data.customInks || []).filter(h => !DEFAULT_INKS.includes(h));
  selectedSwatchHex = null;
  if (!pieceColorMode) renderPaletteSwatches();

  plates.forEach(p => redrawPlate(p));
  syncOverlayBtn();
  buildPieceList();
  updateUsage(); updatePieceCount();
}

function newProject() {
  const hasContent = plates.some(p => p.pieces.length > 0);
  if (hasContent && !confirm('Start a new project? Unsaved changes will be lost.')) return;

  // Tear down
  currentDesignId = null;
  plates.forEach(p => p.dom.container.remove());
  plates = []; activePlateIdx = 0; plateCounter = 0;
  selection = []; isMarqueeDrawing = false; isDraggingSelection = false;
  inkPalette = []; selectedSwatchHex = null;
  Object.keys(historyMap).forEach(k => delete historyMap[k]);

  // Reset mirror without calling toggleMirror (which redraws)
  mirrorMode = false;
  document.getElementById('mirrorBtn').classList.remove('active');
  document.getElementById('mirrorNote').style.display = 'none';

  // Reset color mode without calling setColorMode (which redraws)
  pieceColorMode = true;
  document.getElementById('colorNativeBtn').classList.add('active');
  document.getElementById('colorInkBtn').classList.remove('active');
  document.getElementById('inkPaletteWindow').classList.remove('visible');

  // Build new plate
  const p = createPlate('Plate 1');
  setActivePlate(0);
  redrawPlate(p);
  syncOverlayBtn();
  buildPieceList();
  updateUsage(); updatePieceCount();
  document.getElementById('canvasInner').style.transform = '';
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  if ((e.ctrlKey||e.metaKey) && e.key==='z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); saveDesign(); return; }
  if (e.key==='r'||e.key==='R') rotate(90);
  if (e.key==='e'||e.key==='E') setTool(tool==='erase'?'place':'erase');
  if (e.key==='p'||e.key==='P') setTool('place');
  if (e.key==='s'||e.key==='S') setTool('select');
  if (e.key==='m'||e.key==='M') toggleMirror();
  if (e.key==='Escape') { selectedPiece=null; clearSelection(); hideCtxMenu(); buildPieceList(); }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
createPlate('Plate 1');
setActivePlate(0);
buildPieceList();
updateUsage();
renderPaletteSwatches();
</script>
